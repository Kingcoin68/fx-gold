<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F151D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="author" content="Lưu Khánh Tường – yeahhouse68@gmail.com">
<title>FX GOLD Lưu Khánh Tường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F151D; --s1:#151D27; --s2:#1C2632; --ln:#26323F; --tx:#E6EBF2; --mu:#8D99AB; --dim:#5D6878;
  --brass:#4AA3F0; --brass-ink:#04111E; --up:#2BC59A; --dn:#F05A5E;
  --hi:#F05A5E; --md:#F0A23A; --lo:#8D99AB; --hot:rgba(240,90,94,.13); --next:rgba(74,163,240,.11);
  --f:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fn:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[data-theme=light]{
  --bg:#F2F4F7; --s1:#FFFFFF; --s2:#EBEEF3; --ln:#D9DFE7; --tx:#122030; --mu:#556375; --dim:#97A3B2;
  --brass:#1C6BC0; --brass-ink:#FFFFFF; --up:#0B9670; --dn:#D23B43; --hi:#D23B43; --md:#C47709;
  --lo:#7A8797; --hot:rgba(210,59,67,.09); --next:rgba(28,107,192,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)} .up{color:var(--up)} .dn{color:var(--dn)}

/* ---------- khung ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.brand .bt{display:flex;flex-direction:column;line-height:1.05}
.brand .bt b{font-size:16px;letter-spacing:.02em}
.brand .bt small{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;
  background:var(--s2);color:var(--mu);border:0}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.ok i{background:var(--up)} .pill.bad i{background:var(--dn)} .pill.demo{color:var(--brass)} .pill.demo i{background:var(--brass)}
.hgap{flex:1}
.ib{width:38px;height:38px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;position:relative}
.ib:active{background:var(--s2)} .ib svg{width:21px;height:21px;stroke:var(--tx)}
.ib .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brass);color:var(--brass-ink);font-size:10px;font-weight:700;line-height:16px}
main{padding-bottom:calc(72px + var(--safe-b))}
section.tab{display:none} section.tab.on{display:block}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--s1);border-top:1px solid var(--ln);padding-bottom:var(--safe-b)}
nav.tabbar button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;color:var(--mu);position:relative}
nav.tabbar svg{width:22px;height:22px;stroke:currentColor}
nav.tabbar button[aria-selected=true]{color:var(--tx)}
nav.tabbar button[aria-selected=true]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--brass);border-radius:2px}
.banner{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--next);color:var(--tx);font-size:13px;display:flex;gap:10px;align-items:center}
.banner b{color:var(--brass)}
.banner button{margin-left:auto;border:0;background:var(--brass);color:var(--brass-ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* ---------- tab cặp tiền ---------- */
.lists{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 6px;scrollbar-width:none}
.lists::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--s1);color:var(--mu);border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.chip.add{color:var(--brass);border-style:dashed}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 6px;font-size:12.5px;color:var(--mu)}
.listhead button{border:0;background:none;color:var(--brass);font-weight:600;font-size:13px;padding:6px 0}
.row{position:relative;padding:11px 16px 12px;border-bottom:1px solid var(--ln);background:var(--bg);transition:background .25s}
.row.hot{background:var(--hot)}
.row .r1{display:flex;align-items:baseline;gap:8px}
.row .nm{font-weight:600;font-size:16px;letter-spacing:-.01em}
.row .sfx{font-weight:400;font-size:12px;color:var(--dim);margin-left:2px}
.row .bid{margin-left:auto;font-size:19px;font-weight:600;padding:0 3px;border-radius:4px;transition:background .5s,color .5s}
.row .bid.fu{background:rgba(43,197,154,.18);color:var(--up);transition:none}
.row .bid.fd{background:rgba(240,90,94,.18);color:var(--dn);transition:none}
.row .chg{width:68px;text-align:right;font-size:13px;font-weight:600}
.row .r2{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12.5px;color:var(--mu);min-height:0}
.row .r2:empty{display:none}
.imp{display:inline-block;flex:none;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;line-height:17px}
.imp.i3{background:var(--hi);color:#fff} .imp.i2{background:var(--md);color:#1a1000} .imp.i1{background:var(--s2);color:var(--mu)}
.row .ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .cd{margin-left:auto;flex:none;font-family:var(--fn);font-size:12.5px;color:var(--tx)}
.row.hot .cd{color:var(--hi);font-weight:600}
.row .r3{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12px;color:var(--mu)}
.row .r3:empty{display:none}
.sr b{font-weight:600;color:var(--tx);font-family:var(--fn);font-size:12px}
.sr.k b{color:var(--dn)} .sr.h b{color:var(--up)}
.fuse{position:absolute;left:0;bottom:-1px;height:2px;background:transparent;width:100%}
.fuse i{display:block;height:100%;width:0;background:var(--md);opacity:.75;transition:width 1s linear}
.fuse.i3 i{background:var(--hi)} .fuse.i1 i{background:var(--lo)}
.empty{padding:40px 24px;text-align:center;color:var(--mu)}
.empty button{margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.danger{background:transparent;color:var(--dn);border:1px solid var(--ln)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}

/* ---------- lịch ---------- */
.filters{padding:10px 14px 4px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none} .frow::-webkit-scrollbar{display:none}
.dayh{position:sticky;top:59px;z-index:5;padding:8px 16px;background:var(--s1);border-bottom:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--mu)}
.dayh.today{color:var(--brass)}
.ce{display:grid;grid-template-columns:50px 40px 1fr;gap:4px 8px;padding:10px 16px;border-bottom:1px solid var(--ln);align-items:start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.ce .t{font-family:var(--fn);font-size:13.5px;font-weight:500}
.ce.i3 .t{color:var(--hi);font-weight:600}
.ce .c{font-weight:600;font-size:13px}
.ce .n{font-size:14px}
.ce .v{grid-column:3;display:flex;gap:12px;font-size:12px;color:var(--mu)}
.ce .v b{font-family:var(--fn);font-weight:500;color:var(--tx)}
.ce.past.dim{opacity:.42}
.ce.next{background:var(--next)}
.ce.next .n{font-weight:700}
.ce .cdn{grid-column:3;font-family:var(--fn);font-size:12.5px;color:var(--brass);font-weight:600}

/* ---------- lọc (xem trước) ---------- */
.pv{padding:16px}
.pv h2{font-size:17px;margin:4px 0 6px;letter-spacing:-.01em}
.pv p{margin:0 0 12px;color:var(--mu);font-size:14px}
.rule{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
.rule .gh{font-size:12.5px;color:var(--mu);margin:8px 0 4px}
.cond{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 0;border-top:1px dashed var(--ln);font-size:13.5px}
.cond:first-of-type{border-top:0}
.tok{background:var(--s2);border-radius:6px;padding:2px 7px}
.tok.op{background:transparent;color:var(--brass);font-weight:600;padding:2px 2px}
.tok.tf{border:1px solid var(--ln);background:transparent;font-family:var(--fn);font-size:12px}
.plan li{margin:4px 0;font-size:14px}

/* ---------- bộ lọc ---------- */
.sh2 h2{margin:6px 0 4px}
.sh2 p{margin:0 0 12px}
.fc{margin-top:12px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);overflow:hidden}
.fc.off{opacity:.6}
.fcm{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px 8px}
.fcn{display:block;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.fcl{display:block;font-size:12.5px;color:var(--mu);margin-top:4px;line-height:1.5;max-height:3em;overflow:hidden}
.fch{display:block;font-size:13px;margin-top:6px} .fch b{color:var(--up)}
.fcs{display:flex;gap:18px;padding:8px 14px 12px;border-top:1px solid var(--ln)}
.fcsw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.lop{color:var(--brass);font-weight:700;font-size:12px;letter-spacing:.04em}
.lpar{color:var(--dim);font-weight:600;margin:0 2px}
.logic{margin:12px 0;padding:12px;border-radius:12px;background:var(--next);border:1px solid var(--ln)}
.logic .lh{font-size:12.5px;color:var(--mu);margin-bottom:6px}
.logic .ll{font-size:14px;line-height:1.55;padding:3px 0}
.logic .loff{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.tree{margin:6px 0}
.g2{border:1px solid var(--ln);border-radius:12px;padding:8px 10px 10px;background:var(--s1)}
.g2.sub{background:var(--bg);margin:2px 0}
.g2.off{opacity:.5}
.g2h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g2n{font-weight:700;font-size:13.5px}
.g2s{font-size:12px;color:var(--mu)}
.opsw{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px;gap:2px}
.opsw button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--mu)}
.opsw button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink)}
.g2i{margin:8px 0 0 10px;padding-left:10px;border-left:2px solid var(--ln)}
.jn{font-size:11px;font-weight:700;color:var(--brass);letter-spacing:.05em;padding:3px 0 3px 2px}
.cn{display:flex;align-items:flex-start;gap:8px;padding:6px 0}
.cn.off .ct{opacity:.45;text-decoration:line-through}
.ct{width:100%;text-align:left;border:1px solid var(--ln);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:13.5px;line-height:1.4}
.cw{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ca{display:flex;gap:4px;justify-content:flex-end}
.mini{border:0;background:var(--s2);color:var(--mu);border-radius:6px;min-width:28px;height:26px;font-size:12px;padding:0 6px}
.tk{position:relative;width:24px;height:24px;flex:none;margin-top:6px}
.g2h .tk{margin-top:0}
.tk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tk span{position:absolute;inset:0;border:2px solid var(--dim);border-radius:6px}
.tk input:checked+span{background:var(--brass);border-color:var(--brass)}
.tk input:checked+span::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--brass-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tk input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.g2a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rsum{margin:12px 0 6px;font-size:13px;color:var(--mu)} .rsum b{color:var(--up);font-size:15px}
.rr{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:10px 0}
.rr1{display:flex;align-items:baseline;gap:6px}
.rr1 b{font-size:15px}
.rb{margin-left:auto;font-size:12px;color:var(--mu)}
.rr.hit .rb{color:var(--up);font-weight:700}
.rcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--s2);color:var(--mu)}
.rc i{font-style:normal;font-weight:700}
.rc.y{background:rgba(43,197,154,.14);color:var(--tx)} .rc.y i{color:var(--up)}
.rc.n i{color:var(--dn)}
.rc .num{font-size:11px}
.pps{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pp{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu);flex:1;min-width:90px}
.cprev{margin:16px 0 8px;padding:10px 12px;border-radius:10px;background:var(--next);font-size:14px}
.cprev span{color:var(--mu);font-size:12.5px}
.fm{color:var(--brass);font-weight:600}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,8,12,.55);display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
.ov.on{opacity:1}
.sheet{width:100%;max-height:94vh;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(24px);transition:transform .22s ease-out;border-top:1px solid var(--ln)}
.ov.on .sheet{transform:none}
.sheet.full{height:94vh}
.sh{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--ln)}
.sh h3{margin:0;font-size:16.5px;flex:1;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .x{border:0;background:var(--s2);border-radius:8px;padding:6px 12px;font-size:13.5px}
.sb{flex:1;overflow-y:auto;padding:4px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sf{padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--ln);display:flex;gap:8px}
.sf .btn{flex:1}
@media (prefers-reduced-motion:reduce){.ov,.sheet,.row,.fuse i,.row .bid{transition:none!important}}

/* ---------- form ---------- */
.fs{margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
.fl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.fl label,.fl .lb{flex:1;font-size:14.5px}
.fl small{display:block;color:var(--mu);font-size:12.5px}
.in{background:var(--s1);border:1px solid var(--ln);border-radius:9px;padding:9px 11px;width:100%;font-size:15px}
.in.num{font-family:var(--fn)}
.in.w{width:110px;text-align:right}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--s1);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span,.tk span{pointer-events:none}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s2);border:1px solid var(--ln);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:transform .15s,background .15s}
.sw input:checked+span{background:var(--brass);border-color:var(--brass)}
.sw input:checked+span::after{transform:translateX(18px);background:var(--brass-ink)}
.sw input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.tfs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tfs label{display:inline-flex}
.tfs input{position:absolute;opacity:0}
.tfs span{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font-family:var(--fn);font-size:12.5px;color:var(--mu)}
.tfs input:checked+span{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tfs input:focus-visible+span{outline:2px solid var(--brass)}
.hint{font-size:12.5px;color:var(--mu);margin:6px 0}
.code{display:block;background:var(--s1);border:1px solid var(--ln);border-radius:9px;padding:10px;font-family:var(--fn);font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--brass)}
.step h4{margin:2px 0 4px;font-size:15px}
.step p,.step li{font-size:13.5px;color:var(--mu);margin:3px 0}
.step ol{padding-left:18px;margin:4px 0}
.cp{display:flex;gap:8px;align-items:center}
.cp .code{flex:1}

/* ---------- picker ---------- */
.search{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:2}
.grp{border-bottom:1px solid var(--ln)}
.gh2{display:flex;align-items:center;gap:10px;padding:12px 0}
.gh2 .t{flex:1;font-weight:600}
.gh2 .c{font-size:12.5px;color:var(--mu)}
.gh2 .tg{border:0;background:none;color:var(--mu);padding:4px 6px;font-size:13px}
.ck{width:22px;height:22px;flex:none;accent-color:var(--brass)}
.it{display:flex;align-items:center;gap:10px;padding:8px 0 8px 4px}
.it .s{font-weight:600;font-size:14.5px;min-width:96px}
.it .d{font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items{padding-bottom:6px}

/* ---------- chi tiết ---------- */
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.kv small{display:block;font-size:11.5px;color:var(--mu)}
.kv b{font-family:var(--fn);font-weight:600;font-size:14.5px}
table.srt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.srt th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--ln)}
.srt td{padding:7px 4px;border-bottom:1px solid var(--ln);font-family:var(--fn);font-size:12.5px}
.srt td:first-child{font-family:var(--f);font-weight:600;width:52px}
.srt small{font-family:var(--f);font-size:11.5px}
.al{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.al .tx{flex:1;min-width:0}

/* ---------- phân loại mã ---------- */
const CCY = 'USD EUR GBP JPY CHF CAD AUD NZD SGD HKD NOK SEK DKK PLN HUF CZK TRY ZAR MXN CNH CNY THB INR IDR ILS RUB BRL KRW TWD PHP MYR KES NGN ARS CLP COP SAR AED QAR KWD BHD OMR JOD UAH RON BGN ISK EGP MAD VND'.split(' ');

  ['energy', 'Năng lượng'], ['index', 'Chỉ số'], ['crypto', 'Crypto'], ['stock', 'Cổ phiếu'], ['other', 'Khác']];
function base(n) {
  return String(n).replace(/^[#._]+/, '').replace(/[._#\-].*$/, '').replace(/[a-z]+$/, '') || n;
}
function suffix(n) { const b = base(n); const i = String(n).indexOf(b); return i >= 0 ? String(n).slice(i + b.length) : ''; }
const CLS = {};
function cls(n) {
  if (CLS[n]) return CLS[n];

  let g = 'other';
  if (/^X(AU|AG|PT|PD)[A-Z]{3}$/.test(b) || /metal/.test(p)) g = 'metal';

  }

}
/* ---------- định nghĩa pip ---------- */
const PIP_DEF = {
  fx:     {size: 0.0001, unit: 'pip',   label: 'Forex thường', note: '1 pip = 0.0001'},
  fxjpy:  {size: 0.01,   unit: 'pip',   label: 'Cặp có JPY', note: '1 pip = 0.01'},

  energy: {size: 0.01,   unit: 'pip',   label: 'Dầu, khí', note: '1 pip = 0.01 USD'},
  index:  {size: 1,      unit: 'điểm',  label: 'Chỉ số', note: '1 điểm = 1.0'},
  crypto: {size: 1,      unit: 'giá',   label: 'Crypto (BTC…)', note: '1 giá = 1 USD'},
  stock:  {size: 0.01,   unit: 'cent',  label: 'Cổ phiếu', note: '1 cent = 0.01 USD'},
  other:  {size: 0,      unit: 'pip',   label: 'Mã khác', note: '1 pip = 10 × bước giá nhỏ nhất của sàn'}

function pipKey(n) {
  const g = cls(n), b = base(n);
  if (g.startsWith('fx')) return b.includes('JPY') ? 'fxjpy' : 'fx';
  if (g === 'metal') return b.startsWith('XAU') ? 'gold' : b.startsWith('XAG') ? 'silver' : 'metal';
  return PIP_DEF[g] ? g : 'other';
}
function pipOf(n) {
  const o = S.set.pips.sym[fk(n)];
  if (o && o.size > 0) return {size: +o.size, unit: o.unit || 'pip', own: true};
  const k = pipKey(n), g = S.set.pips.grp[k] || {}, d = PIP_DEF[k];
  let size = +g.size || d.size;
  if (!size) { const i = symInfo(n); size = i ? 10 * Math.pow(10, -i.d) : 0.0001; }
  return {size, unit: g.unit || d.unit};
}
const fmtDist = (n, v) => { const p = pipOf(n), x = v / p.size; return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1)) + ' ' + p.unit; };
/* ---------- tiền tệ liên quan (cho tin) ---------- */
function ccysOf(n) {
  const o = S.set.ccy[fk(n)];
  if (o) return o.split(/[\s,+]+/).filter(Boolean).map(x => x.toUpperCase());
  const g = cls(n), b = base(n).toUpperCase();
  if (g.startsWith('fx')) return [b.slice(0, 3), b.slice(3, 6)];
  if (g === 'metal' || g === 'energy' || g === 'crypto') { const q = b.slice(-3); return [CCY.includes(q) ? q : 'USD']; }
  if (g === 'index') {
    if (/^(DE|GER|DAX|FR|CAC|STOXX|EU|ES|IT)/.test(b)) return ['EUR'];
    if (/^(UK|FTSE)/.test(b)) return ['GBP'];
    if (/^(JP|NIK)/.test(b)) return ['JPY'];
    if (/^(HK|HSI|CN)/.test(b)) return ['CNY', 'HKD'];

}

/* ---------- trạng thái ---------- */
const DEF_LIST = ['EURUSD', 'GBPUSD', 'USDJPY', 'USDCHF', 'USDCAD', 'AUDUSD', 'NZDUSD', 'XAUUSD', 'BTCUSD', 'USOIL', 'US30', 'US500', 'USTEC', 'DE30', 'JP225'];

    v: 1,
    lists: [{n: 'Chính', s: DEF_LIST.slice()}], active: 'Chính',
    alerts: {}, pips: {grp: {}, sym: {}}, ccy: {},
    news: {before: 3, after: 3, hl: 3, show: 2, notifyMin: 0, notifyImp: 3},
    sr: {on: true, all: false, tfs: ['H1', 'H4', 'D1'], bars: Object.assign({}, TF_BARS)},
    notify: {tg: true, push: true},
    cal: {past: 'dim', imps: [3, 2, 1], only: false},
    filters: {}, fseed: false,
    ribbons: [{n: 'Chùm 9-21-50', p: '9,21,50'}, {n: 'Chùm 5-8-13', p: '5,8,13'}, {n: 'Chùm 20-50-200', p: '20,50,200'}],

function mergeSet(x) {

  for (const k of ['news', 'sr', 'notify', 'cal']) o[k] = Object.assign(defaults()[k], x[k] || {});

  o.ccy = x.ccy || {}; o.alerts = x.alerts || {};

  o.lists = (L || d.lists).filter(l => l && l.n).map(l => ({n: l.n, s: Array.isArray(l.s) ? l.s.filter(Boolean) : String(l.s || '').split(',').filter(Boolean)}));

  if (!o.lists.some(l => l.n === o.active)) o.active = o.lists[0].n;

  if (!x.fseed) { o.filters = {}; const t = tplFilters()[0]; const F = normFilter({id: uid(), name: t.name, on: true, alert: false, bar: 1, scope: ['*'], root: t.root, created: Date.now()}); o.filters[F.id] = F; o.fseed = true; }
  else { o.filters = {}; for (const [k, F] of Object.entries(x.filters || {})) if (F && F.root) o.filters[k] = normFilter(Object.assign({}, F, {id: F.id || k})); }

const S = {

/* ---------- lưu & đồng bộ ---------- */
let saveT = 0;

async function pushSettings() {

    await FB.put('/ea', buildEa());

function clean(s) { return String(s || '').replace(/[|\n\r]/g, ' ').slice(0, 80); }
function buildEa() {
  const L = ['V|1'];
  const w = allWatch();
  L.push('W|' + w.join(','));
  L.push('T|' + (S.set.notify.tg ? 1 : 0) + '|' + (S.set.notify.push ? 1 : 0));
  const cc = new Set(); w.forEach(n => ccysOf(n).forEach(c => cc.add(c)));
  L.push('N|' + (S.set.news.notifyMin | 0) + '|' + (S.set.news.notifyImp | 0) + '|' + [...cc].join('+'));
  L.push('S|' + S.set.sr.tfs.map(t => t + ':' + (S.set.sr.bars[t] || TF_BARS[t] || 120)).join(','));
  for (const a of Object.values(S.set.alerts)) {
    if (!a.on) continue;
    if (!(a.rep > 0) && S.fired[a.id]) continue;
    const f = ['A', a.id, a.sym || '-', a.type];
    if (a.type === 'L') f.push(+a.p1, 0, a.dir || 'B');
    else if (a.type === 'Z') f.push(Math.min(+a.p1, +a.p2), Math.max(+a.p1, +a.p2), '');
    else if (a.type === 'R') f.push(+(a.dist * pipOf(a.sym).size).toPrecision(10), 0, (a.tfs || []).join(','));
    else if (a.type === 'N') f.push(a.mins | 0, a.imp | 0, (a.ccys && a.ccys.length ? a.ccys : ccysOf(a.sym)).join('+'));

        if ($$('.ick:checked', G).length) { $('.items', G).hidden = false; $('.tg', G).textContent = 'Thu'; }

      $('#pq', el).oninput = e => {

/* ---------- chi tiết mã ---------- */
function alertText(a) {
  const P = v => a.sym && a.sym !== '-' ? fmtPx(a.sym, v) : v;
  switch (a.type) {
    case 'L': return `${base(a.sym)} ${a.dir === 'U' ? 'cắt lên' : a.dir === 'D' ? 'cắt xuống' : 'chạm'} ${P(a.p1)}`;
    case 'Z': return `${base(a.sym)} vào vùng ${P(Math.min(a.p1, a.p2))}–${P(Math.max(a.p1, a.p2))}`;
    case 'R': return `${base(a.sym)} cách hỗ trợ/kháng cự ${(a.tfs || []).join(', ')} ≤ ${a.dist} ${pipOf(a.sym).unit}`;
    case 'N': return `Tin ${(a.ccys && a.ccys.length ? a.ccys : ccysOf(a.sym)).join(', ')} mức ${IMP[a.imp] || ''} trở lên: báo trước ${a.mins} phút` + (a.sym && a.sym !== '-' ? ` (${base(a.sym)})` : '');
    case 'E': return `Tin ${a.evName || ''}: báo trước ${a.mins} phút`;
  }
  return '';
}
function alertRow(a) {
  const st = !a.on ? 'Đang tắt' : (!(a.rep > 0) && S.fired[a.id]) ? 'Đã báo lúc ' + fDT.format(S.fired[a.id]) : (a.rep > 0 ? `Lặp lại, nghỉ ${a.rep} phút giữa 2 lần` : 'Báo 1 lần');
  return `<div class="al" data-id="${a.id}"><div class="tx"><b>${esc(alertText(a))}</b><small>${esc(st)}${a.note ? ' · ' + esc(a.note) : ''}</small></div>
    <label class="sw"><input type="checkbox" ${a.on && !(!(a.rep > 0) && S.fired[a.id]) ? 'checked' : ''} aria-label="Bật/tắt"><span></span></label><button class="del" type="button">Xoá</button></div>`;
}
function bindAlertRows(el, refresh) {
  $$('.al', el).forEach(r => {
    const a = S.set.alerts[r.dataset.id]; if (!a) return;
    $('input', r).onchange = e => {
      if (e.target.checked) { if (S.fired[a.id]) { delete S.set.alerts[a.id]; a.id = uid(); S.set.alerts[a.id] = a; } a.on = true; }
      else a.on = false;
      save(); refresh(); renderAlertBadge();
    };
    $('.del', r).onclick = () => { delete S.set.alerts[a.id]; save(); refresh(); renderAlertBadge(); toast('Đã xoá báo động'); };
  });
}

    const srRows = TFS.map(tf => { const z = srZones(n, tf); if (!z) return ''; return `<tr><td>${tf}</td><td>${cell(z.r, z.r && z.r.lo - z.b, 'dn')}</td><td>${cell(z.s, z.s && z.b - z.s.hi, 'up')}</td></tr>`; }).join('');

      <div class="fs">Cài đặt riêng cho mã</div>

      <p class="hint">${esc(PIP_DEF[pipKey(n)].label)}: ${p.unit === 'pip' ? '1 pip = ' + p.size : '1 ' + p.unit + ' = ' + p.size} (đổi trong chi tiết mã).</p>

    <div class="fs">Ghi chú (tuỳ chọn)</div><input class="in" id="fNote" maxlength="60" value="${esc(a.note)}" placeholder="Ví dụ: canh sell vùng này">

    full: true, closeText: 'Huỷ',

        if (a.type === 'R' && (!(a.dist > 0) || !a.tfs.length)) return toast('Nhập khoảng cách và chọn ít nhất 1 khung');
        if (a.type === 'N' && !(a.mins > 0)) return toast('Nhập số phút');
        if (a.type === 'R') a.tfs.forEach(t => { if (!S.set.sr.tfs.includes(t)) S.set.sr.tfs.push(t); });
        a.created = a.created || Date.now();
        S.set.alerts[a.id] = a; save(true); s.close(); renderAlertBadge(); toast('Đã lưu báo động'); done && done();
      };
    }
  });
}

      const cs = a.type === 'N' ? (a.ccys && a.ccys.length ? a.ccys : ccysOf(a.sym)) : null;
      for (const e of S.cal) { const dt = e.ms - now; if (dt < 0 || dt > a.mins * 60000) continue;
        if (a.type === 'E' ? String(e.id) === String(a.ev) : (cs.includes(e.c) && e.i >= a.imp)) { st.done = st.done || {}; if (!st.done[e.id]) { st.done[e.id] = 1; hit = true; } } }
    }
    if (hit && a.rep > 0 && st.last && now - st.last < a.rep * 60000) hit = false;
    if (hit) {
      st.last = now; const msg = '🔔 ' + alertText(a) + (a.note ? ' — ' + a.note : '');
      S.log['l' + now + a.id] = {t: now, id: a.id, m: msg}; toast(msg);
      if (!(a.rep > 0)) { S.fired[a.id] = now; renderAlertBadge(); }
    }
  }
}
function startLive() {
  clearInterval(demoT); clearInterval(demoScanT); S.dscan = {}; S.scan = {}; S.demo = false; S.q = {}; S.sr = {}; S.cal = []; CAL_BY = {}; S.hb = null; S.log = {}; S.fired = {}; S.root = {};
  setSymbols([]); renderAll(); FB.connect();
}

/* ---------- khởi động ---------- */
$$('nav.tabbar button').forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  $$('nav.tabbar button').forEach(x => x.setAttribute('aria-selected', x === b));
  $$('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + S.tab));
  if (S.tab === 'cal') { renderCal.scrolled = false; renderCal(); } else window.scrollTo({top: 0});
  if (S.tab === 'scan') renderScan();
});
$('#btnPick').onclick = openPicker;
$('#btnSettings').onclick = openSettings;
$('#btnAlerts').onclick = openAlerts;
$('#status').onclick = openSettings;
setInterval(() => {
  updateRows();
  if (S.tab === 'cal') {
    const now = Date.now();
    $$('[data-cd]').forEach(x => { x.textContent = 'còn ' + hms((+x.dataset.cd - now) / 1000); });
    if (calNextMs && now > calNextMs) renderCal();
  }
  renderStatus();
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !S.demo && S.cfg.mode === 'live') {
    if (!FB.es || FB.es.readyState === 2) FB.connect(); else FB.ping();
  }
});
applyTheme();
if (S.cfg.mode === 'live' && S.cfg.db && S.cfg.key) startLive(); else startDemo();
</script>
